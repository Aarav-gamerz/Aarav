<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Code</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    margin:0;
    overflow:hidden;
    background:#f5f5f5;
}

h1{
    margin-top:80px;
}

#btn{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:24px;
    padding:15px 30px;
    cursor:pointer;
}
</style>
</head>
<body>

<h1>💻 Click the button to get the app code! 💻</h1>

<button id="btn">GET CODE</button>

<script>
const btn = document.getElementById("btn");
let escapes = 0;

const texts = [
    "Dam hai toh pakad ke dikha! 😏",
    "Bas hawa nikal gaya!",
    "Chaldi!",
    "Na ho payega!",
    "Ruku kya!",
    "Bot kehte!",
    "🤣"
];

function moveButton() {
    if (escapes >= 15) return;

    const maxX = window.innerWidth - btn.offsetWidth;
    const maxY = window.innerHeight - btn.offsetHeight;

    btn.style.left = Math.random() * maxX + "px";
    btn.style.top = Math.random() * maxY + "px";
    btn.style.transform = "none";

    btn.innerText = texts[Math.floor(Math.random() * texts.length)];

    escapes++;
}

btn.addEventListener("mouseover", moveButton); // PC

btn.addEventListener("touchstart", function(e) { // Phone
    if (escapes < 15) {
        e.preventDefault();
        moveButton();
    }
});

btn.addEventListener("click", () => {
    document.body.innerHTML = `
        <div style="padding-top:100px;">
            <h1>😂 Just prank all of you!</h1>
            <h2>Main terko kabhi code nahi dunga! 😜</h2>
            <h3>khud se bana dusro ke dekhe cheating mat kar</h3>
        </div>
    `;
});
</script>

</body>
</html>
